<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sickle Art Studio</title>
    <style>
        :root {
            --bg-image: radial-gradient(circle at 50% 20%, #1a162b 0%, #0d0b14 70%, #050408 100%);
            --card-bg: rgba(22, 19, 36, 0.85);
            --card-border: rgba(168, 85, 247, 0.25);
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.4);
            --accent-violet: #a855f7;
            --accent-violet-glow: rgba(168, 85, 247, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--bg-image);
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            font-size: 3.2rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 20px var(--accent-gold-glow));
            font-weight: 900;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0.5rem;
            font-size: 1.15rem;
            letter-spacing: 1px;
        }

        /* Card Grid Layout */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2.5rem;
            width: 100%;
            max-width: 1200px;
            padding: 1rem 0;
        }

        /* Trading Card Styling */
        .trading-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            overflow: hidden;
            position: relative;
            aspect-ratio: 2.5 / 3.5;
            display: flex;
            flex-direction: column;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
        }

        .trading-card:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: var(--accent-gold);
            box-shadow: 0 20px 40px var(--accent-gold-glow), 0 0 25px rgba(245, 158, 11, 0.2);
        }

        .card-image-slot {
            width: 100%;
            height: 65%;
            background-size: cover;
            background-position: center;
            background-color: #0b0914;
            position: relative;
            border-bottom: 1px solid var(--card-border);
        }

        .card-info {
            padding: 1.2rem;
            height: 35%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(180deg, rgba(22, 19, 36, 0.4) 0%, rgba(13, 11, 20, 0.9) 100%);
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-main);
            margin-top: 0.2rem;
        }

        .card-category {
            font-size: 0.8rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        /* Hover Overlay for Commission Tiers */
        .tier-overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 11, 20, 0.94);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
        }

        .trading-card:hover .tier-overlay {
            opacity: 1;
        }

        .tier-title {
            color: var(--accent-gold);
            font-size: 1.4rem;
            margin-bottom: 0.4rem;
            font-weight: 800;
        }

        .tier-price {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 0.6rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .tier-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            line-height: 1.5;
        }

        .click-hint {
            font-size: 0.8rem;
            color: var(--accent-violet);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(168, 85, 247, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        /* Modal & Form for Commission Orders */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(5, 4, 8, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: #120f1f;
            border: 1px solid var(--accent-violet);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 2.2rem;
            position: relative;
            box-shadow: 0 0 40px var(--accent-violet-glow);
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            background: #090712;
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
        }

        .btn-gold {
            background: linear-gradient(135deg, #f59e0b, #b45309);
            color: #0f0f13;
            border: none;
            padding: 0.8rem;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px var(--accent-gold-glow);
        }
    </style>
</head>
<body>

    <header>
        <h1>Sickle Art Studio</h1>
        <p class="subtitle">Collectible Art & Commission Cards</p>
    </header>

    <main class="card-grid" id="cardGrid">
        <!-- Cards will automatically generate here from the list below -->
    </main>

    <!-- Commission Request Modal -->
    <div class="modal" id="commissionModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 style="color: var(--accent-gold); margin-bottom: 1rem;">Commission Request</h2>
            
            <form action="https://formsubmit.co/dr.torsickle@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New Commission Request - Sickle Art Studio">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">

                <div class="form-group">
                    <label>Selected Tier / Artwork</label>
                    <input type="text" id="modalCardTitle" name="Commission Tier" readonly>
                </div>
                <div class="form-group">
                    <label>Your Name / Handle</label>
                    <input type="text" name="Client Handle" required placeholder="e.g. @artist_fan">
                </div>
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" name="Client Email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Commission Details</label>
                    <select name="Commission Type">
                        <option>Standard Render</option>
                        <option>Deluxe Render (+ Background)</option>
                        <option>Commercial Rights Package</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Project Description & References</label>
                    <textarea name="Project Description" rows="4" required placeholder="Describe character, pose, colors, or paste reference links..."></textarea>
                </div>
                <button type="submit" class="btn-gold">Submit Request</button>
            </form>
        </div>
    </div>

    <script>
        /* ==========================================================================
           EASY EDIT SECTION (Swap links, text, prices, and images here!)
           ========================================================================== */

        // 1. OPTIONAL SITE BACKGROUND IMAGE (Leave empty '' to use dark default)
        const SITE_BACKGROUND_JPG = ''; 

        // 2. YOUR ARTWORK CARDS LIST
        // Rearrange, add, or edit items in this list to update your webpage.
        const CARDS = [
            {
                title: 'Character Portrait',
                category: 'Tier I • Digital',
                price: '$75',
                image: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=600&q=80',
                overlayTitle: 'Portrait Tier',
                description: 'Fully rendered headshot/bust illustration with custom background colors.'
            },
            {
                title: 'Full Body Character',
                category: 'Tier II • Concept Art',
                price: '$150',
                image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80',
                overlayTitle: 'Full Body Tier',
                description: 'Complete full-body character design, weapons/props, and dynamic line art.'
            },
            {
                title: 'Full Scene / Illustration',
                category: 'Tier III • Deluxe',
                price: '$250',
                image: 'https://images.unsplash.com/photo-1563089145-599997674d42?auto=format&fit=crop&w=600&q=80',
                overlayTitle: 'Master Tier',
                description: 'Detailed character with complex dynamic background, lighting effects, and full polish.'
            }
        ];

        /* ==========================================================================
           AUTOMATIC RENDER CODE (No need to touch below this line)
           ========================================================================== */

        window.addEventListener('DOMContentLoaded', () => {
            // Set Background Image if provided
            if (SITE_BACKGROUND_JPG.trim() !== '') {
                document.documentElement.style.setProperty(
                    '--bg-image', 
                    `linear-gradient(rgba(10, 8, 16, 0.75), rgba(10, 8, 16, 0.85)), url('${SITE_BACKGROUND_JPG}')`
                );
            }

            // Build Card Grid
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            CARDS.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'trading-card';
                cardDiv.onclick = () => openModal(`${card.title} (${card.price})`);

                cardDiv.innerHTML = `
                    <div class="card-image-slot" style="background-image: url('${card.image}');"></div>
                    <div class="card-info">
                        <div>
                            <div class="card-category">${card.category}</div>
                            <div class="card-title">${card.title}</div>
                        </div>
                    </div>
                    <div class="tier-overlay">
                        <div class="tier-title">${card.overlayTitle}</div>
                        <div class="tier-price">${card.price}</div>
                        <div class="tier-desc">${card.description}</div>
                        <div class="click-hint">Click to Request</div>
                    </div>
                `;
                grid.appendChild(cardDiv);
            });
        });

        function openModal(cardTitle) {
            document.getElementById('modalCardTitle').value = cardTitle;
            document.getElementById('commissionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('commissionModal').style.display = 'none';
        }
    </script>
</body>
</html>
